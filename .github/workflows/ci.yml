name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strawberry Perl'u PATH basina ekle (Git'in gomulu minimal Perl'unu golgeler)
        shell: pwsh
        run: |
          if (Test-Path "C:\Strawberry\perl\bin") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Strawberry\perl\bin"
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      # Web birim testleri CI'da hic kosmuyordu: bosta kalma kilidinin
      # (App.test.tsx, bostaKalma.test.tsx) ve randevu guncellemesinin cagri
      # noktasinin (AnaEkran.test.tsx) TEK kaniti bu testler. Onlar
      # kosmadan CI, "useBostaKalmaKontrolu cagrisi silindi" ya da
      # "kaydet() yeniden POST'a dondu" gibi regresyonlarda yesil kaliyordu.
      # cargo test'ten ONCE: hizli testler once koşsun, geri bildirim erken gelsin.
      - run: npm --prefix web run test
      - run: cargo test --workspace
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  build-macos:
    runs-on: macos-14
    strategy:
      # Iki mimari bagimsiz bilgi kaynagidir: biri duserse digeri yine de
      # calissin. Varsayilan fail-fast, Apple Silicon sonucunu gizliyordu.
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm --prefix web ci
      - run: npx tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
