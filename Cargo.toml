[workspace]
resolver = "2"
members = ["core", "server", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
