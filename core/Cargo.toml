[package]
name = "psikolog-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
rand.workspace = true
hex.workspace = true
time.workspace = true
argon2 = "0.5"
chacha20poly1305 = "0.10"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
uuid = { version = "1", features = ["v4"] }
# PDF uretimi (gomulu font) ve AES-256 (V5) sifreleme. Surumler sabit:
# sifreleme bicimi bir urun karari, kilitli dosyada sessizce degismemeli.
printpdf = { version = "=0.12.8", default-features = false }
lopdf = { version = "=0.45.0", default-features = false }

[dev-dependencies]
tempfile = "3"
